<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MobTracker Screenshot 3</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;900&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Noto Sans KR', sans-serif;
        }

        .canvas {
            width: 430px;
            height: 932px;
            background-color: #0f172a;
            /* Deep Navy */
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .text-container {
            margin-top: 100px;
            text-align: center;
            z-index: 10;
        }

        .main-title {
            color: white;
            font-size: 52px;
            font-weight: 900;
            margin: 0;
            line-height: 1.25;
            letter-spacing: -1.5px;
            word-break: keep-all;
        }

        .phone-mockup {
            position: absolute;
            bottom: -50px;
            width: 85%;
            height: 600px;
            border-top-left-radius: 40px;
            border-top-right-radius: 40px;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            background-color: #0f172a;
        }

        .phone-mockup img {
            width: 100%;
            display: block;
            /* Shift up to show the 4-card grid */
            /* Assuming the grid starts around 40-50% down the screen */
            transform: translateY(-460px);
        }
    </style>
</head>

<body>
    <div class="canvas">
        <div class="text-container">
            <h1 class="main-title">꼭 필요한<br>정보만<br>담았습니다.</h1>
        </div>
        <div class="phone-mockup">
            <img src="source_screenshot.png" alt="App Screenshot">
        </div>
    </div>
</body>

</html>
