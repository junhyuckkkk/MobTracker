<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MobTracker Screenshot 1</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;900&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Noto Sans KR', sans-serif;
        }

        .canvas {
            width: 430px;
            /* Scaled down version of 1290px width for viewing */
            height: 932px;
            /* Scaled down version of 2796px height */
            background-color: #0f172a;
            /* Deep Navy */
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .text-container {
            margin-top: 80px;
            text-align: center;
            z-index: 10;
        }

        .sub-title {
            color: white;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }

        .main-title {
            color: white;
            font-size: 48px;
            font-weight: 900;
            margin: 0;
            letter-spacing: -1px;
        }

        .phone-mockup {
            position: absolute;
            bottom: -50px;
            /* Slight offset to look dynamic */
            width: 85%;
            border-radius: 40px;
            /* Simulate phone screen radius */
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .phone-mockup img {
            width: 100%;
            display: block;
        }
    </style>
</head>

<body>
    <div class="canvas">
        <div class="text-container">
            <div class="sub-title">내 손안의 애드몹 파트너</div>
            <h1 class="main-title">MobTracker</h1>
        </div>
        <div class="phone-mockup">
            <img src="source_screenshot.png" alt="App Screenshot">
        </div>
    </div>
</body>

</html>
